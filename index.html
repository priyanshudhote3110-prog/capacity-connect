<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=frontend/index.html" />
  <title>Capacity Connect (समर्थ-पृथ्वी) — Ministry of Earth Sciences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #07172C;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .tricolor-stripe {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%);
    }
    .launcher-card {
      background: rgba(11, 37, 69, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .emblem {
      height: 64px;
      margin-bottom: 20px;
      filter: brightness(0) invert(1);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #94A3B8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #FF9933;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .redirect-btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF9933 0%, #E67E22 100%);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 6px;
      transition: opacity 0.2s;
    }
    .redirect-btn:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    // Instant programmatic transition to Production LMS
    window.location.replace("frontend/index.html" + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <div class="tricolor-stripe"></div>
  <div class="launcher-card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="Emblem of India" class="emblem" />
    <h1>Capacity Connect (समर्थ-पृथ्वी)</h1>
    <p class="subtitle">Ministry of Earth Sciences, Government of India<br>Launching Official Production LMS Portal...</p>
    <div class="spinner"></div>
    <div>
      <a href="frontend/index.html" class="redirect-btn">Enter Portal →</a>
    </div>
  </div>
</body>
</html>
